version: '3.9'

volumes:
  master:
  worker_1_data:
  worker_2_data:
  worker_3_data:
  worker_4_data:

services:


  master:
    image: citusdata/citus:13
    container_name: master # Unique name
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: mydb
      POSTGRES_HOST_AUTH_METHOD: trust # Insecure for production
    volumes:
    - master:/var/lib/postgresql/data
    #- ./postgres-docker-volume-configs/postgresql.conf:/var/lib/postgresql/data/postgresql.conf
    # tmpfs: /var/lib/postgresql/data
    depends_on:
      worker-1:
        condition: service_healthy
        restart: true
      worker-2:
        condition: service_healthy
        restart: true
      worker-3:
        condition: service_healthy
        restart: true
      worker-4:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mydb"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  worker-1:
    image: citusdata/citus:13
    container_name: worker-1 # Unique name
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: mydb
      POSTGRES_HOST_AUTH_METHOD: trust # Insecure for production
    volumes:
      - worker_1_data:/var/lib/postgresql/data
      #- ./postgres-docker-volume-configs/postgresql.conf:/var/lib/postgresql/data/postgresql.conf
    # tmpfs: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mydb"]
      interval: 5s
      timeout: 5s
      retries: 10
#    ports:
#      - "5433:5432"

  worker-2:
    image: citusdata/citus:13
    container_name: worker-2 # Unique name
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: mydb
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - worker_2_data:/var/lib/postgresql/data
      #- ./postgres-docker-volume-configs/postgresql.conf:/var/lib/postgresql/data/postgresql.conf
      # tmpfs: /var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d mydb" ]
      interval: 5s
      timeout: 5s
      retries: 10
 #   ports:
      # Map unique host port 5434 to the default container port 5432
#      - "5434:5432"

  worker-3:
    image: citusdata/citus:13
    container_name: worker-3 # Unique name
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: mydb
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
    - worker_3_data:/var/lib/postgresql/data
    #- ./postgres-docker-volume-configs/postgresql.conf:/var/lib/postgresql/data/postgresql.conf
    # tmpfs: /var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d mydb" ]
      interval: 5s
      timeout: 5s
      retries: 10
#    ports:
#      - "5435:5432"

  worker-4:
    image: citusdata/citus:13
    container_name: worker-4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: mydb
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - worker_4_data:/var/lib/postgresql/data
      #- ./postgres-docker-volume-configs/postgresql.conf:/var/lib/postgresql/data/postgresql.conf
      # tmpfs: /var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d mydb" ]
      interval: 5s
      timeout: 5s
      retries: 10
