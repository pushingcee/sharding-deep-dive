# Benchmark configuration for Citus sharding (coordinator + 4 workers).
# Both coordinator and workers sourced from benchmark-controls.env (SHARDED_DB_*).
# If you want the coordinator larger than workers, introduce CITUS_MASTER_* vars.
# Invoke with:
#   docker compose --env-file ../benchmark-controls.env -f docker-compose.benchmark.yaml up -d

x-worker-benchmark: &worker-benchmark
  image: citusdata/citus:13
  shm_size: ${SHARDED_DB_SHM_SIZE}
  environment:
    POSTGRES_USER: postgres
    POSTGRES_DB: mydb
    POSTGRES_HOST_AUTH_METHOD: trust
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U postgres -d mydb"]
    interval: 5s
    timeout: 5s
    retries: 10
  deploy:
    resources:
      limits:
        cpus: '${SHARDED_DB_CPUS_LIMIT}'
        memory: ${SHARDED_DB_MEMORY_LIMIT}
      reservations:
        cpus: '${SHARDED_DB_CPUS_RESERVATION}'
        memory: ${SHARDED_DB_MEMORY_RESERVATION}
  command: >
    postgres
    -c shared_buffers=${SHARDED_DB_SHARED_BUFFERS}
    -c work_mem=${SHARDED_DB_WORK_MEM}
    -c maintenance_work_mem=${SHARDED_DB_MAINTENANCE_WORK_MEM}
    -c max_connections=${SHARDED_DB_MAX_CONNECTIONS}

services:
  master:
    image: citusdata/citus:13
    container_name: master
    shm_size: ${SHARDED_DB_SHM_SIZE}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: mydb
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - master:/var/lib/postgresql/data
    depends_on:
      worker-1:
        condition: service_healthy
      worker-2:
        condition: service_healthy
      worker-3:
        condition: service_healthy
      worker-4:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mydb"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    deploy:
      resources:
        limits:
          cpus: '${SHARDED_DB_CPUS_LIMIT}'
          memory: ${SHARDED_DB_MEMORY_LIMIT}
        reservations:
          cpus: '${SHARDED_DB_CPUS_RESERVATION}'
          memory: ${SHARDED_DB_MEMORY_RESERVATION}
    command: >
      postgres
      -c shared_buffers=${SHARDED_DB_SHARED_BUFFERS}
      -c work_mem=${SHARDED_DB_WORK_MEM}
      -c maintenance_work_mem=${SHARDED_DB_MAINTENANCE_WORK_MEM}
      -c max_connections=${SHARDED_DB_MAX_CONNECTIONS}

  worker-1:
    <<: *worker-benchmark
    container_name: worker-1
    volumes:
      - worker_1_data:/var/lib/postgresql/data

  worker-2:
    <<: *worker-benchmark
    container_name: worker-2
    volumes:
      - worker_2_data:/var/lib/postgresql/data

  worker-3:
    <<: *worker-benchmark
    container_name: worker-3
    volumes:
      - worker_3_data:/var/lib/postgresql/data

  worker-4:
    <<: *worker-benchmark
    container_name: worker-4
    volumes:
      - worker_4_data:/var/lib/postgresql/data

volumes:
  master:
    external: true
    name: 02-citus-sharding_master
  worker_1_data:
    external: true
    name: 02-citus-sharding_worker_1_data
  worker_2_data:
    external: true
    name: 02-citus-sharding_worker_2_data
  worker_3_data:
    external: true
    name: 02-citus-sharding_worker_3_data
  worker_4_data:
    external: true
    name: 02-citus-sharding_worker_4_data
