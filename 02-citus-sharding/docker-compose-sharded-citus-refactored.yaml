version: '3.9'

# Common configuration for all worker nodes
x-worker-common: &worker-common
  image: citusdata/citus:13
  environment:
    POSTGRES_USER: postgres
    POSTGRES_DB: mydb
    POSTGRES_HOST_AUTH_METHOD: trust
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U postgres -d mydb"]
    interval: 5s
    timeout: 5s
    retries: 10

volumes:
  master:
  worker_1_data:
  worker_2_data:
  worker_3_data:
  worker_4_data:

services:
  master:
    image: citusdata/citus:13
    container_name: master
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: mydb
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - master:/var/lib/postgresql/data
    depends_on:
      worker-1:
        condition: service_healthy
        restart: true
      worker-2:
        condition: service_healthy
        restart: true
      worker-3:
        condition: service_healthy
        restart: true
      worker-4:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mydb"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  worker-1:
    <<: *worker-common
    container_name: worker-1
    volumes:
      - worker_1_data:/var/lib/postgresql/data

  worker-2:
    <<: *worker-common
    container_name: worker-2
    volumes:
      - worker_2_data:/var/lib/postgresql/data

  worker-3:
    <<: *worker-common
    container_name: worker-3
    volumes:
      - worker_3_data:/var/lib/postgresql/data

  worker-4:
    <<: *worker-common
    container_name: worker-4
    volumes:
      - worker_4_data:/var/lib/postgresql/data 