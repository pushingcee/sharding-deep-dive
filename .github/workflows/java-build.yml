name: Java build

on:
  push:
    branches: [master, main]
    paths:
      - "java/**"
      - ".github/workflows/java-build.yml"
  pull_request:
    paths:
      - "java/**"
      - ".github/workflows/java-build.yml"

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Compile
        working-directory: java/e-commerce-simple-api
        run: mvn -B compile
