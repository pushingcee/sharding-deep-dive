# Benchmark configuration for lookup-table sharding (lookup DB + 4 shards).
# Both lookup-table and shards sourced from benchmark-controls.env (SHARDED_DB_*).
# If you want the lookup-table larger than shards, introduce LOOKUP_TABLE_* vars.
# Invoke with:
#   docker compose --env-file ../benchmark-controls.env -f docker-compose.benchmark.yaml up -d

x-shard-benchmark: &shard-benchmark
  image: postgres:16
  shm_size: ${SHARDED_DB_SHM_SIZE}
  environment:
    POSTGRES_DB: mydb
    POSTGRES_USER: postgres
    POSTGRES_HOST_AUTH_METHOD: trust
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U postgres -d mydb"]
    interval: 5s
    timeout: 5s
    retries: 10
  deploy:
    resources:
      limits:
        cpus: '${SHARDED_DB_CPUS_LIMIT}'
        memory: ${SHARDED_DB_MEMORY_LIMIT}
      reservations:
        cpus: '${SHARDED_DB_CPUS_RESERVATION}'
        memory: ${SHARDED_DB_MEMORY_RESERVATION}
  command: >
    postgres
    -c shared_buffers=${SHARDED_DB_SHARED_BUFFERS}
    -c work_mem=${SHARDED_DB_WORK_MEM}
    -c maintenance_work_mem=${SHARDED_DB_MAINTENANCE_WORK_MEM}
    -c max_connections=${SHARDED_DB_MAX_CONNECTIONS}
    -c random_page_cost=4.0

services:
  lookup-table:
    image: postgres:16
    container_name: lookup-table
    shm_size: ${SHARDED_DB_SHM_SIZE}
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - lookup_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mydb"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '${SHARDED_DB_CPUS_LIMIT}'
          memory: ${SHARDED_DB_MEMORY_LIMIT}
        reservations:
          cpus: '${SHARDED_DB_CPUS_RESERVATION}'
          memory: ${SHARDED_DB_MEMORY_RESERVATION}
    command: >
      postgres
      -c shared_buffers=${SHARDED_DB_SHARED_BUFFERS}
      -c work_mem=${SHARDED_DB_WORK_MEM}
      -c maintenance_work_mem=${SHARDED_DB_MAINTENANCE_WORK_MEM}
      -c max_connections=${SHARDED_DB_MAX_CONNECTIONS}

  shard-1:
    <<: *shard-benchmark
    container_name: shard-1
    ports:
      - "5433:5432"
    volumes:
      - shard_1_data:/var/lib/postgresql/data

  shard-2:
    <<: *shard-benchmark
    container_name: shard-2
    ports:
      - "5434:5432"
    volumes:
      - shard_2_data:/var/lib/postgresql/data

  shard-3:
    <<: *shard-benchmark
    container_name: shard-3
    ports:
      - "5435:5432"
    volumes:
      - shard_3_data:/var/lib/postgresql/data

  shard-4:
    <<: *shard-benchmark
    container_name: shard-4
    ports:
      - "5436:5432"
    volumes:
      - shard_4_data:/var/lib/postgresql/data

volumes:
  lookup_data:
    external: true
    name: 03-manual-sharding-lookup-table_lookup_data
  shard_1_data:
    external: true
    name: 03-manual-sharding-lookup-table_shard_1_data
  shard_2_data:
    external: true
    name: 03-manual-sharding-lookup-table_shard_2_data
  shard_3_data:
    external: true
    name: 03-manual-sharding-lookup-table_shard_3_data
  shard_4_data:
    external: true
    name: 03-manual-sharding-lookup-table_shard_4_data
