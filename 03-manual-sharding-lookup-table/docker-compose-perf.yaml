version: '3.8'
services:
  lookup-table:
    image: postgres:16
    container_name: lookup-table
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ""
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - lookup_table_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: '0.1'       # Small overhead for lookup table
          memory: 64M
    command: >
      postgres 
      -c shared_buffers=16MB 
      -c effective_cache_size=32MB
      -c work_mem=1MB

  shard-1:
    image: postgres:16
    container_name: shard-1
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ""
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - shard_1_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: '0.225'     # Slightly less per shard due to lookup overhead
          memory: 112M
    command: >
      postgres 
      -c shared_buffers=28MB 
      -c effective_cache_size=56MB
      -c work_mem=2MB

  shard-2:
    image: postgres:16
    container_name: shard-2
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ""
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5434:5432"
    volumes:
      - shard_2_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: '0.225'
          memory: 112M
    command: >
      postgres 
      -c shared_buffers=28MB 
      -c effective_cache_size=56MB
      -c work_mem=2MB

  shard-3:
    image: postgres:16
    container_name: shard-3
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ""
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5435:5432"
    volumes:
      - shard_3_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: '0.225'
          memory: 112M
    command: >
      postgres 
      -c shared_buffers=28MB 
      -c effective_cache_size=56MB
      -c work_mem=2MB

  shard-4:
    image: postgres:16
    container_name: shard-4
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ""
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5436:5432"
    volumes:
      - shard_4_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: '0.225'
          memory: 112M
    command: >
      postgres 
      -c shared_buffers=28MB 
      -c effective_cache_size=56MB
      -c work_mem=2MB

volumes:
  lookup_table_data:
    external: true
  shard_1_data:
    external: true
  shard_2_data:
    external: true
  shard_3_data:
    external: true
  shard_4_data:
    external: true