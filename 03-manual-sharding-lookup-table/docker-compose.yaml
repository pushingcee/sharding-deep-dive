version: '3.9'

x-shard-common: &shard-common
  image: postgres:16
  environment:
    POSTGRES_USER: postgres
    POSTGRES_DB: mydb
    POSTGRES_HOST_AUTH_METHOD: trust
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U postgres -d mydb"]
    interval: 5s
    timeout: 5s
    retries: 10
  tmpfs: /var/lib/postgresql/data

services:
  lookup-table:
    <<: *shard-common
    container_name: lookup-table
    ports:
      - "5432:5432"

  shard-1:
    <<: *shard-common
    container_name: shard-1
    ports:
      - "5433:5432"

  shard-2:
    <<: *shard-common
    container_name: shard-2
    ports:
      - "5434:5432"

  shard-3:
    <<: *shard-common
    container_name: shard-3
    ports:
      - "5435:5432"

  shard-4:
    <<: *shard-common
    container_name: shard-4
    ports:
      - "5436:5432" 
