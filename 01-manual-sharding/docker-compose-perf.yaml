version: '3.8'
services:
  shard-1:
    image: postgres:16
    container_name: shard-1
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ""
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - shard_1_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: '0.25'      # Quarter CPU per shard
          memory: 128M      # Quarter memory per shard
    command: >
      postgres 
      -c shared_buffers=32MB 
      -c effective_cache_size=64MB
      -c work_mem=2MB

  shard-2:
