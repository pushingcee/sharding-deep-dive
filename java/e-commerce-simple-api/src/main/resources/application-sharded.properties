# Sharded profile configuration
# Disable DataSource auto-configuration since we're using manual configuration
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.rest.RepositoryRestMvcAutoConfiguration

# Disable JPA DDL operations since tables are created by Python script
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Logging for sharded operations
logging.level.org.learn.repository.sharded=DEBUG
logging.level.org.learn.configuration.sharded=DEBUG 