# Shared configuration for all profiles (single, sharded, lookup).
#
# Every profile configures its DataSource(s) manually in
# org.learn.configuration.* so all strategies run the identical JDBC stack.
# Do NOT add per-query logging (hibernate SQL, statement tracing) here or in
# any profile file — it distorts the benchmark for whichever profile has it.
spring.threads.virtual.enabled=true
