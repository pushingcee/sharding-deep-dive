# Single-DB profile (also used for Citus, where the coordinator looks like a
# single database). DataSource is configured manually in
# SingleDataSourceConfig; JPA/Hibernate is not used — repositories are
# JdbcTemplate-based, identical to the sharded/lookup profiles.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.rest.RepositoryRestMvcAutoConfiguration
