# Benchmark configuration for single database.
# Constraints sourced from benchmark-controls.env (SINGLE_DB_*).
# Invoke with:
#   docker compose --env-file ../benchmark-controls.env -f docker-compose.benchmark.yaml up -d

services:
  single_instance:
    image: postgres:16
    container_name: single_instance
    shm_size: ${SINGLE_DB_SHM_SIZE}
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - single_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mydb"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '${SINGLE_DB_CPUS_LIMIT}'
          memory: ${SINGLE_DB_MEMORY_LIMIT}
        reservations:
          cpus: '${SINGLE_DB_CPUS_RESERVATION}'
          memory: ${SINGLE_DB_MEMORY_RESERVATION}
    command: >
      postgres
      -c shared_buffers=${SINGLE_DB_SHARED_BUFFERS}
      -c work_mem=${SINGLE_DB_WORK_MEM}
      -c maintenance_work_mem=${SINGLE_DB_MAINTENANCE_WORK_MEM}
      -c max_connections=${SINGLE_DB_MAX_CONNECTIONS}
      -c random_page_cost=4.0

volumes:
  single_data:
    external: true
    name: 00-single-db_single_data
